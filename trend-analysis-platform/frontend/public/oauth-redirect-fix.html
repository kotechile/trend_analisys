<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Completing sign in...</h2>
        <p>Redirecting to your app...</p>
    </div>

    <script>
        (function() {
            console.log('OAuth redirect handler: Starting...');
            console.log('Current URL:', window.location.href);
            console.log('URL search:', window.location.search);
            console.log('URL hash:', window.location.hash);
            
            // Get the app origin from localStorage (set by GoogleAuth component)
            const storedAppOrigin = localStorage.getItem('oauth_redirect_url');
            console.log('Stored app origin:', storedAppOrigin);
            
            // Default to localhost:3001 if not stored
            const appOrigin = storedAppOrigin || 'http://localhost:3001';
            const fullAppOrigin = appOrigin.startsWith('http') ? appOrigin : `http://${appOrigin}`;
            
            // Get all URL parameters (both search and hash)
            const searchParams = window.location.search;
            const hashParams = window.location.hash;
            
            // Construct the redirect URL
            let redirectUrl = `${fullAppOrigin}/auth/callback`;
            
            // Preserve hash parameters (OAuth tokens are usually in hash)
            if (hashParams) {
                redirectUrl += hashParams;
            } else if (searchParams) {
                // If no hash, use search params
                redirectUrl += searchParams;
            }
            
            console.log('Redirecting to:', redirectUrl);
            
            // Redirect immediately
            window.location.replace(redirectUrl);
        })();
    </script>
</body>
</html>
