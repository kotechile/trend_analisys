version: '3.8'

services:
  # =============================================================================
  # FRONTEND (Next.js)
  # =============================================================================
  frontend:
    build:
      context: ./profit-path-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY}
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: profit-path-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Add other frontend env vars here if needed
      - NEXT_PUBLIC_API_URL=https://your-domain.com/api
    expose:
      - "3000"
    networks:
      - app-network

  # =============================================================================
  # BACKEND (FastAPI)
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: trend-analysis-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=${API_KEY}
      # Secrets should be loaded from .env
    depends_on:
      - redis
    networks:
      - app-network

  # =============================================================================
  # REDIS (Cache / Queues)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: trend-analysis-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # =============================================================================
  # NGINX (Reverse Proxy)
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: trend-analysis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  redis_data:


networks:
  app-network:
    driver: bridge
